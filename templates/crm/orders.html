<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM Arabica</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --panel: #fffaf3;
      --line: #dfd6ca;
      --text: #201711;
      --muted: #716257;
      --accent: #9b4d2c;
      --accent-dark: #74361d;
      --green: #247857;
      --amber: #9a6200;
      --blue: #2f5f8f;
      --danger: #9d2d24;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    select {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: rgb(255 250 243 / 94%);
      backdrop-filter: blur(10px);
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
    }

    .live::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
    }

    .live.is-online::before {
      background: var(--green);
    }

    .live.is-offline::before {
      background: var(--danger);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 16px;
      padding: 18px 24px 28px;
      align-items: start;
    }

    .lane {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgb(255 250 243 / 72%);
    }

    .lane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
    }

    .lane-title {
      margin: 0;
      font-size: 15px;
    }

    .count {
      min-width: 28px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #ece3d8;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .lane-body {
      display: grid;
      gap: 10px;
      padding: 12px;
      min-height: 140px;
    }

    .empty {
      min-height: 116px;
      display: grid;
      place-items: center;
      border: 1px dashed #d9cec0;
      border-radius: 8px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 18px;
    }

    .order {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 20px rgb(54 38 24 / 7%);
      overflow: hidden;
    }

    .order-main {
      padding: 13px;
    }

    .order-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .order-id {
      font-size: 17px;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      line-height: 1;
      background: #efe7dc;
      color: var(--muted);
    }

    .badge.accepted {
      background: #fff1cf;
      color: var(--amber);
    }

    .badge.ready {
      background: #def4ea;
      color: var(--green);
    }

    .badge.on_the_way {
      background: #e0ecf8;
      color: var(--blue);
    }

    .details {
      display: grid;
      gap: 6px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .items {
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 7px;
      font-size: 14px;
    }

    .items li {
      display: grid;
      gap: 3px;
      padding-top: 7px;
      border-top: 1px solid #f0e7dc;
    }

    .item-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .options {
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: grid;
      gap: 8px;
      padding: 11px 13px 13px;
      border-top: 1px solid var(--line);
      background: #fbf6ef;
    }

    .action-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .btn {
      min-height: 36px;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 8px 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--accent-dark);
    }

    .btn.secondary {
      background: #fff;
      color: var(--accent-dark);
      border-color: #d8c9b7;
    }

    .btn.secondary:hover {
      background: #f6eee4;
    }

    .select {
      width: 100%;
      min-height: 36px;
      border: 1px solid #d8c9b7;
      border-radius: 7px;
      padding: 7px 9px;
      background: #fff;
      color: var(--text);
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      max-width: min(360px, calc(100vw - 36px));
      padding: 12px 14px;
      border: 1px solid #dfc0b9;
      border-radius: 8px;
      background: #fff;
      color: var(--danger);
      box-shadow: 0 16px 38px rgb(54 38 24 / 16%);
      display: none;
    }

    .toast.is-visible {
      display: block;
    }

    @media (max-width: 980px) {
      .board {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  {{ orders|json_script:"initial-orders" }}
  {{ couriers|json_script:"couriers-data" }}
  {% csrf_token %}

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>Arabica CRM</h1>
        <span>{{ cafe.name }}{% if cafe.address %} · {{ cafe.address }}{% endif %}</span>
      </div>
      <div class="top-meta">
        <span id="total-count">{{ active_count }} активных</span>
        <span id="live-state" class="live">подключение</span>
      </div>
    </header>

    <main class="board" id="board">
      <section class="lane" data-lane="accepted">
        <div class="lane-head">
          <h2 class="lane-title">Новые</h2>
          <span class="count" data-count="accepted">0</span>
        </div>
        <div class="lane-body" data-body="accepted"></div>
      </section>

      <section class="lane" data-lane="ready">
        <div class="lane-head">
          <h2 class="lane-title">Готовые</h2>
          <span class="count" data-count="ready">0</span>
        </div>
        <div class="lane-body" data-body="ready"></div>
      </section>

      <section class="lane" data-lane="on_the_way">
        <div class="lane-head">
          <h2 class="lane-title">В доставке</h2>
          <span class="count" data-count="on_the_way">0</span>
        </div>
        <div class="lane-body" data-body="on_the_way"></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const state = {
      orders: JSON.parse(document.getElementById("initial-orders").textContent),
      couriers: JSON.parse(document.getElementById("couriers-data").textContent),
    };

    const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
    const liveState = document.getElementById("live-state");
    const totalCount = document.getElementById("total-count");
    const toast = document.getElementById("toast");
    const statuses = ["accepted", "ready", "on_the_way"];

    function setLive(text, className) {
      liveState.textContent = text;
      liveState.className = `live ${className}`;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("is-visible");
      window.setTimeout(() => toast.classList.remove("is-visible"), 3600);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function optionText(options) {
      if (!options || !options.length) {
        return "";
      }
      return options.map((option) => option.value).join(", ");
    }

    function renderActions(order) {
      if (order.status === "accepted") {
        return `<button type="button" class="btn" data-action="mark-ready" data-order="${order.id}">Готов</button>`;
      }

      if (order.status === "ready" && order.delivery_type === "pickup") {
        return `<button type="button" class="btn" data-action="mark-delivered" data-order="${order.id}">Выдан</button>`;
      }

      if (order.status === "ready" && order.delivery_type === "delivery") {
        const options = state.couriers.map((courier) => {
          return `<option value="${courier.id}">${escapeHtml(courier.phone_number)}</option>`;
        }).join("");

        return `
          <div class="action-row">
            <select class="select" data-courier="${order.id}">
              <option value="">Курьер</option>
              ${options}
            </select>
            <button type="button" class="btn" data-action="assign-courier" data-order="${order.id}">В путь</button>
          </div>
        `;
      }

      return "";
    }

    function renderOrder(order) {
      const customer = order.customer.name || order.customer.phone_number;
      const destination = order.delivery_type === "delivery"
        ? escapeHtml(order.address || "Адрес не указан")
        : "Самовывоз";
      const courier = order.courier.phone_number
        ? `<div>Курьер: ${escapeHtml(order.courier.phone_number)}</div>`
        : "";

      const items = order.items.map((item) => {
        const options = optionText(item.options);
        return `
          <li>
            <div class="item-line">
              <span>${escapeHtml(item.product_title)} × ${item.quantity}</span>
              <strong>${escapeHtml(item.final_price)}</strong>
            </div>
            ${options ? `<span class="options">${escapeHtml(options)}</span>` : ""}
          </li>
        `;
      }).join("");

      return `
        <article class="order" data-order-card="${order.id}">
          <div class="order-main">
            <div class="order-row">
              <span class="order-id">#${order.id}</span>
              <span class="badge ${order.status}">${escapeHtml(order.status_label)}</span>
            </div>
            <div class="details">
              <div>${escapeHtml(customer)}</div>
              <div>${escapeHtml(order.delivery_type_label)} · ${destination}</div>
              <div>${order.created_at}${order.delivery_time ? ` · ${order.delivery_time}` : ""}</div>
              ${courier}
            </div>
            <ul class="items">${items}</ul>
            <div class="order-row" style="margin-top: 12px;">
              <span class="badge">${order.items.length} поз.</span>
              <strong>${escapeHtml(order.total_price)}</strong>
            </div>
          </div>
          <div class="actions">${renderActions(order)}</div>
        </article>
      `;
    }

    function render() {
      const grouped = Object.fromEntries(statuses.map((status) => [status, []]));
      state.orders.forEach((order) => {
        if (grouped[order.status]) {
          grouped[order.status].push(order);
        }
      });

      statuses.forEach((status) => {
        const body = document.querySelector(`[data-body="${status}"]`);
        const orders = grouped[status];
        document.querySelector(`[data-count="${status}"]`).textContent = orders.length;
        body.innerHTML = orders.length
          ? orders.map(renderOrder).join("")
          : '<div class="empty">Нет заказов</div>';
      });

      totalCount.textContent = `${state.orders.length} активных`;
    }

    async function postAction(button, orderId, action) {
      const body = new FormData();
      if (action === "assign-courier") {
        const select = document.querySelector(`[data-courier="${orderId}"]`);
        if (!select || !select.value) {
          showToast("Выберите курьера.");
          return;
        }
        body.append("courier_id", select.value);
      }

      button.disabled = true;
      try {
        const response = await fetch(`/crm/orders/${orderId}/${action}/`, {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "X-CSRFToken": csrfToken,
            "X-Requested-With": "XMLHttpRequest",
          },
          body,
        });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          showToast(payload.detail || "Действие не выполнено.");
          return;
        }

        if (Array.isArray(payload.orders)) {
          state.orders = payload.orders;
          render();
        } else {
          window.location.reload();
        }
      } catch (error) {
        showToast("Нет связи с сервером.");
      } finally {
        button.disabled = false;
      }
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) {
        return;
      }
      event.preventDefault();
      event.stopPropagation();
      postAction(button, button.dataset.order, button.dataset.action);
    });

    function connectSocket() {
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      const socket = new WebSocket(`${protocol}://${window.location.host}/ws/crm/orders/`);

      socket.addEventListener("open", () => setLive("live", "is-online"));
      socket.addEventListener("close", () => {
        setLive("offline", "is-offline");
        window.setTimeout(connectSocket, 2500);
      });
      socket.addEventListener("error", () => setLive("ошибка", "is-offline"));
      socket.addEventListener("message", (event) => {
        const payload = JSON.parse(event.data);
        if (payload.type === "orders.snapshot") {
          state.orders = payload.orders;
          render();
        }
      });
    }

    render();
    connectSocket();
  </script>
</body>
</html>

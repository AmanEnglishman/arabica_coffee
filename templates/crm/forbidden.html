<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM Arabica</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f1eb;
      color: #241812;
    }

    main {
      width: min(420px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid #ddd3c5;
      border-radius: 8px;
      background: #fffaf3;
      box-shadow: 0 16px 40px rgb(54 38 24 / 12%);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    p {
      margin: 0;
      line-height: 1.5;
      color: #6a5a4d;
    }
  </style>
</head>
<body>
  <main>
    <h1>Нет доступа</h1>
    <p>Вход доступен только сотрудникам кафе.</p>
  </main>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нет доступа — Arabica CRM</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f0ebe3;
      color: #1a110a;
      padding: 20px;
    }

    .card {
      width: min(420px, 100%);
      background: #fff;
      border: 1px solid #e0d5c8;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(60,35,15,.12);
      padding: 40px 36px;
      text-align: center;
    }

    .icon {
      font-size: 52px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #8b1a1a;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: #5c4b3c;
      margin-bottom: 24px;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 22px;
      border-radius: 8px;
      background: #8b3a1a;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: background .15s;
    }

    a:hover { background: #6e2c12; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>Нет доступа</h1>
    <p>Вход в CRM доступен только сотрудникам кафе.<br>Если вы сотрудник — обратитесь к администратору.</p>
    <a href="/admin/login/">← Войти в систему</a>
  </div>
</body>
</html>
